[tool.poetry]
name = "forecast-service"
version = "0.1.0"
description = "Machine Learning Forecast Service"
authors = ["AlexGreasley1 <aejg201@exeter.ac.uk>","JedLeas <jedleasyt@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.135.0"
uvicorn = "^0.27.0"
scikit-learn = "1.7.1"
pandas = "^2.2.0"
sqlalchemy = "^2.0.46"
psycopg2-binary = "^2.9.11"
python-multipart = ">=0.0.22"
python-dotenv = "^1.2.1"
requests = "^2.32.5"
httpx = "0.27.2"
pyjwt = "^2.11.0"
sentence-transformers = "^3.0.0"
tf-keras = "^2.15.0"
starlette = ">=0.47.2"
imbalanced-learn = "^0.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "pip-audit (>=2.10.0,<3.0.0)"
]


